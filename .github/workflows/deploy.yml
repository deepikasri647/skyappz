
name: CardioCare CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy website to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/cardiocare-deploy/"

      - name: Install web server and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt-get update
            sudo apt-get install -y nginx rsync
            sudo mkdir -p /var/www/html
            sudo rsync -av --exclude='.git/' --exclude='.github/' /home/ubuntu/cardiocare-deploy/ /var/www/html/
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx
            curl -f http://127.0.0.1/
